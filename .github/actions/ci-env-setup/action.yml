name: "CI environment setup"
description: |
  * set home bazelrc for CI runner
  * set buildbuddy api key
  * use and push to Cachix cache

inputs:
  buildbuddy-api-key:
    required: true
    description: |
      BuildBuddy API key to access the remote cache.
  cachix-auth-token:
    default: ""
    description: |
      Cachix auth token to push to the cache. If empty, the cache is read only.

runs:
  using: "composite"
  steps:
    - uses: nixbuild/nix-quick-install-action@v32

    - name: setup ci bazelrc
      shell: bash
      run: |
        cp .github/workflows/ci.bazelrc ~/.bazelrc
        # tag BuildBuddy invocations with the commit of the pull request, not
        # the merge commit that GitHub Actions checks out
        cat >> ~/.bazelrc << EOF
        common:remote-cache --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
        common:remote-cache --build_metadata=BRANCH_NAME=${{ github.head_ref || github.ref_name }}
        common:remote-cache --build_metadata=REPO_URL=${{ github.server_url }}/${{ github.repository }}
        EOF
        rw_api_key="${{ inputs.buildbuddy-api-key }}"
        if [[ -n "$rw_api_key" ]]; then
          echo "common:remote-cache --remote_header=x-buildbuddy-api-key=$rw_api_key" >> ~/.bazelrc
          echo "common:remote-cache --bes_header=x-buildbuddy-api-key=$rw_api_key" >> ~/.bazelrc
        fi

    - uses: cachix/cachix-action@v15
      with:
        name: oliverlee
        authToken: ${{ inputs.cachix-auth-token }}
