name: "CI environment setup"
description: |
  * set home bazelrc for CI runner
  * set buildbuddy api key
  * restore nix store

inputs:
  buildbuddy-api-key:
    required: true
    description: |
      BuildBuddy API key to access the remote cache.
  external-cache-key:
    default: ${{ runner.arch }}_${{ runner.os }}-default
    description: |
      Key specifying which cache to restore.

runs:
  using: "composite"
  steps:
    - uses: endersonmenezes/free-disk-space@v2
      if: runner.os == 'Linux'
      with:
        remove_android: true
        # https://github.com/apache/arrow/blob/main/ci/scripts/util_free_space.sh#L63
        remove_folders: "/opt/hostedtoolcache"

    - uses: nixbuild/nix-quick-install-action@v32

    - name: setup ci bazelrc
      shell: bash
      run: |
        cp .github/workflows/ci.bazelrc ~/.bazelrc
        rw_api_key="${{ inputs.buildbuddy-api-key }}"
        if [[ -n "$rw_api_key" ]]; then
          echo "common:remote-cache --remote_header=x-buildbuddy-api-key=$rw_api_key" >> ~/.bazelrc
          echo "common:remote-cache --bes_header=x-buildbuddy-api-key=$rw_api_key" >> ~/.bazelrc
        fi

    - name: restore nix store
      uses: nix-community/cache-nix-action/restore@v6
      with:
        paths: |
          /nix
          ~/.cache/nix
          ~root/.cache/nix
        primary-key: nix-store-${{ inputs.external-cache-key }}
        save: false
