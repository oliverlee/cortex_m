name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
    types: [synchronize, opened, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        system:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        bazel_version:
          - pinned
          - 8.x
          - 9.x
        include:
          - bazel_version: pinned
            lockfile_mode: error
          # other Bazel versions may write a different lockfile
          - bazel_version: 8.x
            lockfile_mode: update
          - bazel_version: 9.x
            lockfile_mode: update
        exclude:
          - system: macos-latest
            bazel_version: pinned
    runs-on: ${{ matrix.system }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/ci-env-setup
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
        cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
    - env:
        USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
      run: |
        if [[ "$USE_BAZEL_VERSION" == pinned ]]; then
          source .bazeliskrc
        fi
        cd example
        bazelisk test \
          --compilation_mode=opt \
          --lockfile_mode=${{ matrix.lockfile_mode }} \
          //...

  test:
    strategy:
      fail-fast: false
      matrix:
        compilation_mode:
          - fastbuild
          - opt
        system:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.system }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/ci-env-setup
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
        cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
    - run: |
        bazelisk test \
          --compilation_mode=${{ matrix.compilation_mode }} \
          //...

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/ci-env-setup
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
        cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
    - run: |
        bazelisk run //tools:format.check

  bazel-wrapper-pins:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/ci-env-setup
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
    - run: |
        bazelisk test //tools/nix:pins_test

  # https://emmer.dev/blog/skippable-github-status-checks-aren-t-really-required/
  # https://github.com/marketplace/actions/alls-green
  all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - examples
      - test
      - format
      - bazel-wrapper-pins
    steps:
    - uses: Kesin11/actions-timeline@v2
    - uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
